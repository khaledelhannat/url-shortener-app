name: Release pipeline (build + push)

on:
  workflow_run:
    workflows: ["Quality gate pipeline (system-validation)"]
    types:
      - completed

jobs:
  # DOCKER BUILD & PUSH PIPELINE
  docker_ops:
    if: ${{ github.event.workflow_run.conclusion == 'success'}}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            khaledelhannat/url-shortener-api:${{ github.sha }}
            khaledelhannat/url-shortener-api:latest

  update_infra_manifest:
    needs: docker_ops

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Infrastructure Repo
        uses: actions/checkout@v4
        with:
          repository: "khaledelhannat/url-shortener-infra"

          token: ${{ secrets.INFRA_REPO_PAT }}
          ref: "main"

      - name: Update Image Tag using yq
        run: |
          yq -i '.spec.template.spec.containers[0].image = "khaledelhannat/url-shortener-api:${{ github.sha }}"' environments/dev/app/deployment.yaml

      - name: Commit and Push to Infra Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add environments/dev/app/deployment.yaml
          git commit -m "chore: bump api image version to ${{ github.sha }} [skip ci]"
          git push origin main
